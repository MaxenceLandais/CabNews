# CabNews source inbox — mechanical OPEN feeds → inbox/sources/
# No LLM. Feeds Grok Bot MAJ routines (06:00 / 12:00 / 16:00 Europe/Paris).
#
# Schedule targets (Paris wall clock): ~05:45, 11:45, 15:45
# GitHub Actions cron is UTC only.
#
# Primary = CEST (UTC+2, late Mar–late Oct):
#   05:45 Paris → 03:45 UTC
#   11:45 Paris → 09:45 UTC
#   15:45 Paris → 13:45 UTC
#   cron: 45 3,9,13 * * *
#
# CET drift (UTC+1, winter): the same UTC crons hit ~04:45 / 10:45 / 14:45 Paris
# (about 1h earlier than the CEST targets). Acceptable for pre-MAJ enrichment;
# do not add a second winter cron (would double-run in summer).
#
# Avoid loops: commit message includes [skip ci]; only inbox/ is committed;
# paths-ignore on push so inbox commits do not re-trigger this workflow.

name: cabnews-inbox

on:
  schedule:
    # CEST primary ≈ 05:45 / 11:45 / 15:45 Europe/Paris (see header for CET drift)
    - cron: "45 3,9,13 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/cabnews-inbox/**"
      - ".github/workflows/cabnews-inbox.yml"

concurrency:
  group: cabnews-inbox
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch open sources into inbox/
        run: node scripts/cabnews-inbox/fetch.mjs

      - name: Commit inbox/ only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inbox/
          if git diff --cached --quiet; then
            echo "No inbox changes to commit."
            exit 0
          fi
          git commit -m "chore(inbox): refresh open sources [skip ci]"
          git push
